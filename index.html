<!DOCTYPE html> <!-- 指定使用 HTML5 文件標準 -->
<html lang="zh-Hant"> <!-- 設定頁面語言為繁體中文 -->
<head> <!-- 開始設定文件資訊與樣式 -->
	<meta charset="UTF-8"> <!-- 使用 UTF-8 正確顯示繁體中文 -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 讓版面配合手機寬度顯示 -->
	<meta name="theme-color" content="#f3f6f1"> <!-- 設定行動瀏覽器工具列的主題色 -->
	<link rel="preconnect" href="https://fonts.googleapis.com"> <!-- 提前連線至 Google Fonts 字型樣式服務 -->
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> <!-- 提前連線至 Google Fonts 字型檔服務 -->
	<link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@200..900&family=Zen+Maru+Gothic:wght@300;400;500;700;900&display=swap" rel="stylesheet"> <!-- 載入指定範圍的內文字體與五種標題字體字重 -->
	<title>小組計時器</title> <!-- 設定瀏覽器分頁標題 -->
	<style> /* 開始撰寫不需外部套件的頁面樣式 */
		:root { /* 集中管理頁面的色彩與共用尺寸 */
			color-scheme: light; /* 指定使用明亮色彩介面 */
			--canvas: #f3f6f1; /* 設定使用者指定的淡綠背景色 */
			--ink: #172b2a; /* 設定主要文字的深墨綠色 */
			--muted: #687774; /* 設定輔助文字的灰綠色 */
			--line: #d8e1da; /* 設定輸入框與分隔線顏色 */
			--green: #2e7967; /* 設定主要操作按鈕的綠色 */
			--coral: #d84f43; /* 設定倒數最後十秒的警示紅色 */
			--ring-size: min(72vw, 540px); /* 依畫面寬度限制大型圓環尺寸 */
			font-family: "Chiron GoRound TC", sans-serif; /* 將整頁文字設定為指定的圓體 */
			font-optical-sizing: auto; /* 依字體大小自動調整字形光學尺寸 */
			font-synthesis: none; /* 避免瀏覽器自行合成粗體或斜體 */
			text-rendering: optimizeLegibility; /* 優先改善文字的可讀性 */
		} /* 結束共用變數設定 */
		* { box-sizing: border-box; } /* 讓尺寸計算包含內距與邊框 */
		html, body { min-width: 320px; min-height: 100%; margin: 0; } /* 移除頁面邊界並支援小螢幕 */
		body { color: var(--ink); background-color: var(--canvas); background-image: radial-gradient(#dfe8df 0.8px, transparent 0.8px); background-size: 18px 18px; } /* 設定文字色與使用者指定的點狀背景 */
		button, input { font: inherit; } /* 讓按鈕與輸入框沿用頁面字體 */
		button { color: inherit; } /* 讓按鈕文字沿用主要文字顏色 */
		.app { min-height: 100svh; display: flex; flex-direction: column; } /* 建立至少填滿視窗高度的應用程式版面 */
		.topbar { width: min(1280px, 100%); margin: 0 auto; padding: 26px clamp(20px, 5vw, 64px); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgb(23 43 42 / 10%); } /* 以細分隔線建立簡潔頁首 */
		.brand { display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 750; letter-spacing: 0; } /* 設定品牌名稱的字重與排列 */
		.brand-mark { width: 102px; height: 102px; display: grid; place-items: center; } /* 預留放大一點五倍後的標題圖示空間 */
		.brand-mark img { width: 102px; height: 102px; object-fit: contain; transform: translateX(+20px); } /* 放大計時器插畫並向左移四像素 */
		.top-note { color: var(--muted); font-size: 13px; } /* 降低頁首輔助文字的視覺權重 */
		main { width: min(1280px, 100%); flex: 1; margin: 0 auto; padding: clamp(32px, 6vh, 64px) clamp(20px, 5vw, 64px); display: grid; grid-template-columns: minmax(270px, 0.74fr) minmax(0, 1.5fr); align-items: center; gap: clamp(36px, 7vw, 96px); } /* 建立設定區與大型計時顯示區 */
		.tab-bar { width: min(1280px, 100%); margin: 0 auto; padding: 14px clamp(20px, 5vw, 64px) 0; display: flex; gap: 8px; border-bottom: 1px solid var(--line); } /* 在頁首下方建立計時模式分頁列 */
		.tab-button { min-height: 46px; padding: 0 16px; border: 0; border-bottom: 3px solid transparent; color: var(--muted); background: transparent; font-size: 15px; font-weight: 700; cursor: pointer; } /* 設定可清楚辨識的分頁按鈕 */
		.tab-button[aria-selected="true"] { border-bottom-color: var(--green); color: var(--ink); } /* 標示目前選取的計時模式 */
		.tab-panel[hidden] { display: none; } /* 切換分頁時隱藏非作用中的內容 */
		.stopwatch-panel { display: block; } /* 讓碼表分頁以卡片版面呈現 */
		.stopwatch-toolbar { margin-bottom: 30px; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; } /* 將碼表標題與全部控制按鈕並排 */
		.stopwatch-title .eyebrow { margin-bottom: 10px; } /* 縮短碼表分類文字與標題之間的距離 */
		.stopwatch-description { margin: 10px 0 0; color: var(--muted); font-size: 15px; } /* 顯示碼表頁面的簡短說明 */
		.stopwatch-actions { display: flex; flex-shrink: 0; gap: 10px; } /* 將全部開始與重置按鈕並排 */
		.stopwatch-actions button { min-height: 54px; padding: 0 20px; border-radius: 8px; font-size: 15px; font-weight: 750; cursor: pointer; } /* 統一全部控制按鈕的點擊尺寸 */
		.reset-all-button { border: 1px solid var(--line); background: rgb(255 255 255 / 70%); } /* 使用次要按鈕樣式顯示全部重置 */
		.reset-all-button:hover { border-color: var(--ink); background: #fff; } /* 提示全部重置按鈕可操作 */
		.stopwatch-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 14px; } /* 依可用空間排列五組碼表卡片 */
		.stopwatch-card { min-width: 0; padding: 20px; display: grid; gap: 22px; border: 1px solid var(--line); border-radius: 8px; background: rgb(255 255 255 / 72%); } /* 建立每組獨立碼表的清楚卡片 */
		.stopwatch-card h2 { margin: 0 0 12px; font-size: 20px; font-weight: 750; } /* 標示各小組名稱 */
		.stopwatch-clock { position: relative; width: 180px; max-width: 100%; margin: 0 auto; aspect-ratio: 1; display: grid; place-items: center; } /* 建立各組碼表的正圓進度顯示區 */
		.stopwatch-progress-ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); } /* 將碼表圓環進度起點移至正上方 */
		.stopwatch-ring-track, .stopwatch-progress { fill: none; stroke-width: 8; } /* 設定碼表圓環底軌與進度線 */
		.stopwatch-ring-track { stroke: #f3f6f1; } /* 使用指定的背景色顯示尚未開始的圓環 */
		.stopwatch-progress { stroke: url(#ringGradient); stroke-linecap: round; transition: stroke-dashoffset 180ms linear; } /* 以漸層描邊呈現每分鐘累積進度 */
		.stopwatch-progress-head { transition: cx 100ms linear, cy 100ms linear, fill 180ms ease; } /* 平順移動前端標記並切換圈數顏色 */
		.stopwatch-time { position: relative; margin: 0; font-size: 40px; font-weight: 650; line-height: 1; font-variant-numeric: tabular-nums; } /* 將大尺寸等寬碼表時間置於圓心 */
		.stopwatch-toggle { width: 100%; } /* 讓單組開始與暫停按鈕填滿卡片寬度 */
		.controls { width: 100%; max-width: 380px; } /* 限制控制欄寬度以方便掃讀 */
		.eyebrow { margin: 0 0 12px; color: var(--green); font-size: 12px; font-weight: 800; letter-spacing: 1.4px; } /* 標示課堂計時的小型分類文字 */
		h1 { margin: 0; font-family: "Zen Maru Gothic", sans-serif; font-size: clamp(32px, 4vw, 48px); font-weight: 900; line-height: 1.15; letter-spacing: 0; } /* 使用九百字重的指定字體顯示頁面標題 */
		.description { margin: 12px 0 34px; color: var(--muted); font-size: 15px; line-height: 1.7; } /* 提供精簡的課堂情境說明 */
		.field-label { display: block; margin-bottom: 10px; font-size: 13px; font-weight: 700; } /* 將輸入欄位標籤放在輸入框上方 */
		.time-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } /* 並排顯示分鐘與秒數輸入框 */
		.field { min-width: 0; } /* 允許輸入欄位在窄畫面中縮小 */
		.input-wrap { height: 58px; padding: 0 15px; display: flex; align-items: center; gap: 9px; border: 1px solid var(--line); border-radius: 8px; background: rgb(255 255 255 / 76%); transition: border-color 160ms ease, box-shadow 160ms ease; } /* 建立清楚且易操作的時間輸入框 */
		.input-wrap:focus-within { border-color: var(--green); box-shadow: 0 0 0 3px rgb(46 121 103 / 13%); } /* 使用鍵盤輸入時顯示明確焦點 */
		.input-wrap input { width: 100%; min-width: 0; padding: 0; border: 0; outline: 0; color: var(--ink); background: transparent; font-size: 24px; font-weight: 750; font-variant-numeric: tabular-nums; } /* 讓數字輸入易讀並使用等寬數字 */
		.input-wrap input::-webkit-inner-spin-button, .input-wrap input::-webkit-outer-spin-button { margin: 0; appearance: none; } /* 隱藏瀏覽器預設的數字微調按鈕 */
		.unit { color: var(--muted); font-size: 13px; white-space: nowrap; } /* 標示分鐘與秒數單位 */
		.quick-heading { margin: 25px 0 11px; font-size: 13px; font-weight: 700; } /* 設定快速時間選項標題 */
		.presets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; } /* 將六個快速按鈕排成三欄 */
		.preset { min-height: 42px; border: 1px solid var(--line); border-radius: 7px; background: rgb(255 255 255 / 58%); font-size: 13px; font-weight: 650; cursor: pointer; transition: background 150ms ease, border-color 150ms ease, color 150ms ease, transform 150ms ease; } /* 設定低干擾的快速選擇按鈕 */
		.preset:hover { transform: translateY(-1px); border-color: var(--green); color: var(--green); background: #fff; } /* 滑過快速按鈕時回饋可互動狀態 */
		.preset[aria-pressed="true"] { border-color: var(--green); color: var(--green); background: #e7f0eb; } /* 標示目前選中的快速時間 */
		.actions { margin-top: 25px; display: grid; grid-template-columns: 1fr 52px 52px; gap: 10px; } /* 將開始、重設與全螢幕按鈕並排 */
		.start-button, .reset-button, .fullscreen-button { min-height: 54px; display: grid; place-items: center; border-radius: 8px; cursor: pointer; transition: background 150ms ease, transform 150ms ease, border-color 150ms ease; } /* 設定一致且容易點擊的操作按鈕尺寸 */
		.start-button { border: 1px solid var(--green); color: #fff; background: var(--green); font-size: 15px; font-weight: 750; } /* 讓開始與暫停按鈕成為主要操作 */
		.start-button:hover { transform: translateY(-1px); background: #256554; } /* 滑過主要操作時稍微加深 */
		.reset-button, .fullscreen-button { border: 1px solid var(--line); background: rgb(255 255 255 / 65%); } /* 讓次要圖示按鈕清楚但不搶焦點 */
		.reset-button:hover, .fullscreen-button:hover { border-color: var(--ink); background: #fff; } /* 提示次要圖示按鈕可操作 */
		.reset-button svg, .fullscreen-button svg { width: 19px; height: 19px; } /* 限制次要按鈕圖示尺寸 */
		.fullscreen-exit-icon { display: none; } /* 預設隱藏離開全螢幕圖示 */
		.fullscreen-button[aria-pressed="true"] .fullscreen-enter-icon { display: none; } /* 全螢幕時隱藏進入全螢幕圖示 */
		.fullscreen-button[aria-pressed="true"] .fullscreen-exit-icon { display: block; } /* 全螢幕時顯示離開全螢幕圖示 */
		button:focus-visible { outline: 3px solid rgb(46 121 103 / 36%); outline-offset: 3px; } /* 為鍵盤操作提供清楚的按鈕焦點 */
		button:disabled, input:disabled { cursor: not-allowed; opacity: 0.58; } /* 讓倒數期間鎖定的設定呈現不可操作狀態 */
		.timer-panel { min-width: 0; display: grid; justify-items: center; } /* 將倒數圓環與文字置中顯示 */
		.timer-shell { position: relative; width: var(--ring-size); max-width: 100%; aspect-ratio: 1; display: grid; place-items: center; } /* 保持圓環為正圓並避免超出容器 */
		.progress-ring { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; transform: rotate(-90deg); } /* 將 SVG 進度起點移到圓環頂端 */
		.ring-track, .ring-progress { fill: none; stroke-width: 13; } /* 設定圓環底軌與進度線的基本樣式 */
		.ring-track { stroke: #dce6df; } /* 使用淡綠灰色顯示完整圓環底軌 */
		.ring-progress { stroke: url(#ringGradient); stroke-linecap: round; transition: stroke-dashoffset 450ms linear, stroke 200ms ease; } /* 使用漸層圓環並平順更新倒數進度 */
		.timer-center { position: relative; z-index: 1; display: grid; justify-items: center; text-align: center; } /* 將時間與標籤固定於圓環中央 */
		.time-display { margin: 0; font-size: clamp(76px, 12vw, 144px); font-weight: 750; line-height: 1; letter-spacing: 0; font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; } /* 使用超大等寬數字方便投影辨讀 */
		.time-caption { margin-top: 17px; color: var(--muted); font-size: 30px; line-height: 1.2; } /* 以約三十像素顯示圓環內的狀態提示 */
		.timer-panel.is-urgent .time-display, .timer-panel.is-urgent .time-caption { color: var(--coral); } /* 最後十秒將數字與提示轉為紅色 */
		.timer-panel.is-urgent .ring-progress { stroke: var(--coral); } /* 最後十秒將圓環進度轉為紅色 */
		.timer-panel.is-urgent .ring-track { stroke: #f0d7d2; } /* 最後十秒同步調整底軌的警示色 */
		.timer-panel.is-urgent .time-display, .timer-panel.is-urgent .ring-progress { animation: urgent-pulse 700ms ease-in-out infinite alternate; } /* 讓警示數字與圓環進度同步閃爍 */
		.timer-panel.is-finished .time-display, .timer-panel.is-finished .time-caption { color: var(--coral); } /* 時間結束後保持紅色提醒 */
		.timer-panel.is-finished .ring-progress { stroke: var(--coral); } /* 時間結束後讓圓環呈現警示色 */
		html.timer-finished-flash { animation: finished-flash 250ms steps(2, start) 20; } /* 時間結束時將全畫面反色閃爍五秒 */
		@keyframes urgent-pulse { from { opacity: 1; } to { opacity: 0.35; } } /* 定義最後十秒柔和的閃爍動畫 */
		@keyframes finished-flash { to { filter: invert(1); } } /* 定義交替反轉全畫面色彩的動畫 */
		@media (min-width: 1100px) { /* 大螢幕時讓計時數字維持足夠大的投影尺寸 */
			.time-display { font-size: clamp(120px, 11vw, 164px); } /* 加大寬螢幕中央的倒數數字 */
		} /* 結束大螢幕樣式 */
		@media (max-width: 760px) { /* 手機與窄螢幕改為設定在上、計時器在下 */
			:root { --ring-size: min(84vw, 450px); } /* 在手機上使用更大的可用圓環寬度 */
			.topbar { padding-top: 18px; padding-bottom: 18px; } /* 縮小手機頁首的上下留白 */
			.top-note { font-size: 12px; } /* 讓手機上的頁首提示保持精簡 */
			.tab-bar { padding-top: 8px; } /* 縮小手機版分頁列的上方留白 */
			main { grid-template-columns: minmax(0, 1fr); gap: 38px; padding-top: 34px; padding-bottom: 36px; } /* 將設定區與圓環改為直向排列 */
			.controls { max-width: 460px; margin: 0 auto; } /* 讓手機設定欄置中並保持好讀寬度 */
			.description { margin-bottom: 25px; } /* 減少手機設定區內的垂直空間 */
			.timer-panel { width: 100%; } /* 讓圓環在手機上使用完整容器寬度 */
			.time-display { font-size: clamp(78px, 22vw, 132px); } /* 讓手機大字隨螢幕寬度縮放 */
			.stopwatch-toolbar { align-items: stretch; flex-direction: column; gap: 20px; } /* 將手機版碼表操作改為直向排列 */
			.stopwatch-actions { width: 100%; } /* 讓全部控制按鈕填滿手機版工具列 */
			.stopwatch-actions button { flex: 1; padding: 0 12px; } /* 平分手機版全部控制按鈕寬度 */
		} /* 結束手機版樣式 */
		@media (prefers-reduced-motion: reduce) { /* 尊重使用者關閉動畫的系統偏好 */
			*, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; } /* 將動畫與轉場縮至幾乎不動 */
			html.timer-finished-flash { animation: none !important; } /* 尊重減少動態效果偏好並停用畫面閃爍 */
		} /* 結束減少動態效果設定 */
	</style> <!-- 結束頁面樣式 -->
</head> <!-- 結束文件資訊設定 -->
<body> <!-- 開始顯示頁面內容 -->
	<div class="app"> <!-- 建立完整的應用程式外框 -->
		<header class="topbar"> <!-- 顯示頁面品牌與課堂提示 -->
			<div class="brand"> <!-- 將圖示與產品名稱組合在一起 -->
				<span class="brand-mark" aria-hidden="true"> <!-- 顯示不需螢幕閱讀器朗讀的品牌圖示底色 -->
					<img src="libraries/計時器.png" alt=""> <!-- 使用 libraries 資料夾中的計時器插畫 -->
				</span> <!-- 結束品牌圖示底色 -->
				<span>小組計時器</span> <!-- 顯示頁面名稱 -->
			</div> <!-- 結束品牌區 -->
			<span class="top-note">GROUP SESSION TIMER</span> <!-- 顯示適合課堂使用的英文提示 -->
		</header> <!-- 結束頁首 -->
		<nav class="tab-bar" role="tablist" aria-label="計時模式"> <!-- 提供倒數計時與小組碼表分頁 -->
			<button id="countdownTab" class="tab-button" type="button" role="tab" aria-controls="countdownPanel" aria-selected="true" tabindex="0">倒數計時</button> <!-- 切換至既有倒數計時器 -->
			<button id="stopwatchTab" class="tab-button" type="button" role="tab" aria-controls="stopwatchPanel" aria-selected="false" tabindex="-1">小組碼表</button> <!-- 切換至五組獨立碼表 -->
		</nav> <!-- 結束計時模式分頁列 -->
		<main id="countdownPanel" class="tab-panel" role="tabpanel" aria-labelledby="countdownTab"> <!-- 開始既有倒數設定與計時內容 -->
			<section class="controls" aria-labelledby="page-title"> <!-- 建立時間設定與操作區 -->
				<p class="eyebrow">CLASSROOM TOOL</p> <!-- 顯示小型課堂工具分類 -->
				<h1 id="page-title">掌握討論時間</h1> <!-- 顯示主要頁面標題 -->
	
				<label class="field-label" for="minutes">設定時間</label> <!-- 為時間輸入欄提供可存取標籤 -->
				<div class="time-fields"> <!-- 並排放置分鐘與秒數欄位 -->
					<div class="field"> <!-- 建立分鐘輸入欄位容器 -->
						<div class="input-wrap"> <!-- 建立分鐘輸入框的視覺外觀 -->
							<input id="minutes" type="number" min="0" max="999" value="5" inputmode="numeric" aria-label="分鐘"/> <!-- 輸入 0 到 999 分鐘 -->
							<span class="unit">分鐘</span> <!-- 標示分鐘欄位單位 -->
						</div> <!-- 結束分鐘輸入框外觀 -->
					</div> <!-- 結束分鐘輸入欄位容器 -->
					<div class="field"> <!-- 建立秒數輸入欄位容器 -->
						<div class="input-wrap"> <!-- 建立秒數輸入框的視覺外觀 -->
							<input id="seconds" type="number" min="0" max="59" value="0" inputmode="numeric" aria-label="秒數"/> <!-- 輸入 0 到 59 秒 -->
							<span class="unit">秒</span> <!-- 標示秒數欄位單位 -->
						</div> <!-- 結束秒數輸入框外觀 -->
					</div> <!-- 結束秒數輸入欄位容器 -->

	<audio id="alarmAudio" src="libraries/計時器.mp3" preload="auto" hidden></audio> <!-- 載入時間到時播放的本機鬧鈴音檔 -->
	<script> // 開始撰寫倒數與按鈕互動程式
		const minuteInput = document.querySelector("#minutes"); // 取得分鐘輸入欄位
		const secondInput = document.querySelector("#seconds"); // 取得秒數輸入欄位
		const startButton = document.querySelector("#startButton"); // 取得開始與暫停按鈕
		const resetButton = document.querySelector("#resetButton"); // 取得重設按鈕
		const fullscreenButton = document.querySelector("#fullscreenButton"); // 取得全螢幕切換按鈕
		const timeDisplay = document.querySelector("#timeDisplay"); // 取得顯示剩餘時間的文字
		const timeCaption = document.querySelector("#timeCaption"); // 取得時間下方的狀態提示
		const timerPanel = document.querySelector("#timerPanel"); // 取得控制警示色與閃爍的計時區
		const progressRing = document.querySelector("#progressRing"); // 取得 SVG 圓環進度線
		const alarmAudio = document.querySelector("#alarmAudio"); // 取得時間到時使用的本機音檔
		const countdownTab = document.querySelector("#countdownTab"); // 取得倒數計時分頁按鈕
		const stopwatchTab = document.querySelector("#stopwatchTab"); // 取得小組碼表分頁按鈕
		const countdownPanel = document.querySelector("#countdownPanel"); // 取得倒數計時分頁內容
		const stopwatchPanel = document.querySelector("#stopwatchPanel"); // 取得小組碼表分頁內容
		const timerTabBar = document.querySelector(".tab-bar"); // 取得計時模式分頁列
		const allStopwatchesButton = document.querySelector("#allStopwatchesButton"); // 取得全部開始與全部暫停按鈕
		const resetAllStopwatchesButton = document.querySelector("#resetAllStopwatchesButton"); // 取得全部重置按鈕
		const stopwatchGroups = [...document.querySelectorAll(".stopwatch-card")].map((card) => ({ // 從五張卡片建立各組獨立狀態
			id: Number(card.dataset.groupId), // 記錄小組編號
			elapsedMilliseconds: 0, // 保存已累積的碼表毫秒數
			startedAt: 0, // 保存本次開始時的時間戳記
			interval: null, // 保存本組畫面更新計時器
			isRunning: false, // 記錄本組碼表是否正在運作
			color: card.dataset.groupColor, // 保存本組前端標記使用的深色
			timeElement: card.querySelector(".stopwatch-time"), // 取得本組時間文字
			progressElement: card.querySelector(".stopwatch-progress"), // 取得本組 SVG 圓環進度線
			progressHeadElement: card.querySelector(".stopwatch-progress-head"), // 取得本組移動中的圓環前端
			toggleButton: card.querySelector(".stopwatch-toggle") // 取得本組開始與暫停按鈕
		})); // 結束建立五組碼表狀態
		const presetButtons = [...document.querySelectorAll(".preset")]; // 收集所有快速設定按鈕
		const ringCircumference = 2 * Math.PI * 153; // 依圓環半徑計算 SVG 圓周長
		const stopwatchRingCircumference = 2 * Math.PI * 78; // 依碼表圓環半徑計算每分鐘進度圓周長
		let remainingSeconds = 300; // 記錄目前剩餘秒數並以五分鐘作為初始值
		let configuredSeconds = 300; // 記錄按下開始時要採用的原始秒數
		let deadline = 0; // 記錄倒數結束時的時間戳記
		let timerInterval = null; // 保存定時更新用的計時器識別值
		let isRunning = false; // 記錄目前是否正在倒數
		let isFinished = false; // 記錄倒數是否已經結束
		let alarmStopTimeout = null; // 保存兩秒後停止鬧鈴的計時器
		progressRing.style.strokeDasharray = String(ringCircumference); // 設定 SVG 圓環的完整描邊長度
		progressRing.style.strokeDashoffset = "0"; // 初始顯示完整的圓環進度
		function formatTime(totalSeconds) { // 將秒數格式化為 MM:SS
			const minutes = Math.floor(totalSeconds / 60); // 計算剩餘的完整分鐘數
			const seconds = totalSeconds % 60; // 計算剩餘的秒數
			return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`; // 使用至少兩位數顯示時間
		} // 結束時間格式化函式
		function formatStopwatchTime(totalMilliseconds) { // 將碼表毫秒數格式化為 MM:SS
			return formatTime(Math.floor(totalMilliseconds / 1000)); // 捨去未滿一秒的部分並沿用共用時間格式
		} // 結束碼表時間格式化函式
		function getStopwatchElapsed(group) { // 取得本組累積的實際經過時間
			return group.elapsedMilliseconds + (group.isRunning ? Date.now() - group.startedAt : 0); // 以時間戳計算避免背景分頁延遲影響碼表
		} // 結束計算碼表經過時間函式
		function renderStopwatchGroup(group) { // 更新指定小組的時間與操作按鈕
			const elapsedMilliseconds = getStopwatchElapsed(group); // 取得本組目前累積的碼表時間
			group.timeElement.textContent = formatStopwatchTime(elapsedMilliseconds); // 顯示本組目前經過時間
			const minuteProgress = (elapsedMilliseconds % 60000) / 60000; // 計算目前圈數內前端標記的位置
			const completedRings = Math.floor(elapsedMilliseconds / 60000); // 計算已完整完成的圓環圈數
			const visibleProgress = Math.min(elapsedMilliseconds / 60000, 1); // 首圈填滿後保留完整圓環而不再清空
			group.progressElement.style.strokeDasharray = String(stopwatchRingCircumference); // 設定本組圓環描邊總長度
			group.progressElement.style.strokeDashoffset = String(stopwatchRingCircumference * (1 - visibleProgress)); // 逐步填滿首圈並保留已完成的圓環
			const angle = minuteProgress * 2 * Math.PI; // 計算前端標記沿圓環移動的角度
			group.progressHeadElement.setAttribute("cx", String(90 + 78 * Math.cos(angle))); // 更新前端標記的水平位置
			group.progressHeadElement.setAttribute("cy", String(90 + 78 * Math.sin(angle))); // 更新前端標記的垂直位置

				timeCaption.textContent = "等待開始"; // 將提示文字還原為待命狀態
				updatePresetSelection(); // 對照分鐘與秒數更新快速選項標記
				renderTimer(); // 立即顯示新設定的時間與圓環
			}); // 結束單一時間欄位輸入事件
		}); // 結束分鐘與秒數欄位事件綁定
		configuredSeconds = readConfiguredTime(); // 依 HTML 預設值初始化完整設定時間
		remainingSeconds = configuredSeconds; // 依 HTML 預設值初始化剩餘時間
		updatePresetSelection(); // 初始化快速設定按鈕的選取外觀
		renderTimer(); // 首次載入時顯示預設時間與完整圓環
	</script> <!-- 結束倒數計時程式 -->
</body> <!-- 結束頁面內容 -->
</html> <!-- 結束 HTML 文件 -->
